<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduMath AI｜國中數學 AI 家教</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4A90E2;
      --primary-dark: #2563eb;
      --primary-light: #e8f3fd;
      --accent: #7c3aed;
      --green: #10b981;
      --orange: #f59e0b;
      --red: #ef4444;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-600: #4b5563;
      --gray-800: #1f2937;
      --white: #ffffff;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(0,0,0,0.09);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.07);
      --transition: 0.22s ease;
    }

    body {
      font-family: -apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
      background: linear-gradient(135deg,#eef2ff 0%,#f0fdf4 100%);
      min-height: 100vh;
      padding: 0;
    }

    /* ─── Screen system ─── */
    .screen { display: none; min-height: 100vh; }
    .screen.active { display: block; }

    /* ─── Login / Grade screens (centred card) ─── */
    .screen-centred {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .screen-centred.active { display: flex; }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      width: 100%;
      max-width: 480px;
      animation: fadeUp 0.35s ease;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ─── Hero banner ─── */
    .hero {
      background: linear-gradient(135deg,var(--primary) 0%,var(--accent) 100%);
      padding: 48px 40px 40px;
      text-align: center;
      color: var(--white);
    }
    .hero-icon {
      width:64px; height:64px;
      background:rgba(255,255,255,0.18);
      border-radius:18px;
      display:flex; align-items:center; justify-content:center;
      margin:0 auto 20px; font-size:30px;
    }
    .hero h1 { font-size:2rem; font-weight:800; letter-spacing:.02em; margin-bottom:8px; }
    .hero p  { font-size:.97rem; opacity:.88; line-height:1.6; }

    /* ─── Form ─── */
    .form-section { padding:36px 40px 40px; }
    .form-label { display:block; font-size:.875rem; font-weight:600; color:var(--gray-600); margin-bottom:8px; }
    .form-input {
      width:100%; padding:14px 16px; font-size:1rem; font-family:inherit;
      border:2px solid var(--gray-200); border-radius:10px; outline:none;
      transition:border-color var(--transition); color:var(--gray-800); background:var(--gray-50);
    }
    .form-input:focus { border-color:var(--primary); background:var(--white); }
    .form-input::placeholder { color:var(--gray-400); }
    .hint { font-size:.8rem; color:var(--red); margin-top:6px; min-height:18px; display:none; }
    .hint.visible { display:block; }

    .btn-primary {
      display:block; width:100%; margin-top:20px; padding:15px;
      font-size:1rem; font-weight:700; font-family:inherit; color:var(--white);
      background:linear-gradient(135deg,var(--primary),var(--accent));
      border:none; border-radius:10px; cursor:pointer;
      transition:opacity var(--transition),transform var(--transition); letter-spacing:.03em;
    }
    .btn-primary:hover  { opacity:.92; transform:translateY(-1px); }
    .btn-primary:active { opacity:1;   transform:translateY(0); }

    /* ─── Grade select ─── */
    .step-header { padding:36px 40px 0; text-align:center; }
    .step-header .avatar {
      width:56px; height:56px; border-radius:50%;
      background:linear-gradient(135deg,var(--primary),var(--accent));
      color:var(--white); font-size:1.5rem;
      display:flex; align-items:center; justify-content:center;
      margin:0 auto 16px; font-weight:800;
    }
    .step-header h2 { font-size:1.25rem; font-weight:700; color:var(--gray-800); line-height:1.5; }
    .step-header p  { font-size:.875rem; color:var(--gray-600); margin-top:6px; }

    .grade-list { display:flex; flex-direction:column; gap:14px; padding:28px 40px 40px; }
    .btn-grade {
      display:flex; align-items:center; gap:16px; padding:18px 20px;
      font-size:1rem; font-family:inherit; font-weight:600;
      color:var(--gray-800); background:var(--gray-50);
      border:2px solid var(--gray-200); border-radius:12px; cursor:pointer;
      transition:border-color var(--transition),background var(--transition),transform var(--transition);
    }
    .btn-grade:hover { border-color:var(--primary); background:var(--primary-light); transform:translateX(4px); }
    .btn-grade .grade-badge {
      width:40px; height:40px; border-radius:10px;
      display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0;
    }
    .badge-g7{background:#dbeafe;} .badge-g8{background:#ede9fe;} .badge-g9{background:#fce7f3;}
    .btn-grade .grade-info { flex:1; }
    .btn-grade .grade-name { display:block; font-size:1rem; font-weight:700; }
    .btn-grade .grade-sub  { display:block; font-size:.8rem; color:var(--gray-600); margin-top:2px; }
    .btn-grade .arrow { color:var(--gray-400); font-size:1.1rem; }

    .progress-dots { display:flex; justify-content:center; gap:8px; padding:0 0 20px; margin-top:16px; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--gray-200); transition:background var(--transition),width var(--transition); }
    .dot.active { background:var(--primary); width:24px; border-radius:4px; }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════
     SCREEN 1 — Login
══════════════════════════════════════════ -->
<div class="screen-centred active" id="s-login">
  <div>
    <div class="card">
      <div class="hero">
        <div class="hero-icon">🧮</div>
        <h1>EduMath AI</h1>
        <p>你的專屬國中數學 AI 智慧家教</p>
      </div>
      <div class="form-section">
        <label class="form-label" for="student-name">學生姓名</label>
        <input class="form-input" type="text" id="student-name" placeholder="請輸入你的名字" maxlength="30" autocomplete="off"/>
        <p class="hint" id="name-hint">請輸入你的姓名後再繼續 👆</p>
        <button class="btn-primary" id="btn-start">開始學習 →</button>
      </div>
    </div>
    <div class="progress-dots">
      <div class="dot active"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     SCREEN 2 — Grade Select
══════════════════════════════════════════ -->
<div class="screen-centred" id="s-grade">
  <div>
    <div class="card">
      <div class="step-header">
        <div class="avatar" id="avatar-initial">?</div>
        <h2>歡迎，<span id="display-name">同學</span>！<br>請選擇你的年級</h2>
        <p>選擇後即可進入專屬課程</p>
      </div>
      <div class="grade-list">
        <button class="btn-grade" data-grade="7" data-label="七年級（國一）">
          <span class="grade-badge badge-g7">📐</span>
          <span class="grade-info"><span class="grade-name">七年級（國一）</span><span class="grade-sub">整數運算、代數、幾何基礎</span></span>
          <span class="arrow">›</span>
        </button>
        <button class="btn-grade" data-grade="8" data-label="八年級（國二）">
          <span class="grade-badge badge-g8">📊</span>
          <span class="grade-info"><span class="grade-name">八年級（國二）</span><span class="grade-sub">方程式、函數、三角形</span></span>
          <span class="arrow">›</span>
        </button>
        <button class="btn-grade" data-grade="9" data-label="九年級（國三）">
          <span class="grade-badge badge-g9">🎯</span>
          <span class="grade-info"><span class="grade-name">九年級（國三）</span><span class="grade-sub">二次函數、統計、會考複習</span></span>
          <span class="arrow">›</span>
        </button>
      </div>
    </div>
    <div class="progress-dots">
      <div class="dot"></div><div class="dot active"></div><div class="dot"></div>
    </div>
  </div>
</div>


<!-- ══════════════════════════════════════════
     SCREEN 3 — Dashboard (七年級)
══════════════════════════════════════════ -->
<div class="screen" id="s-dashboard">
  <!-- Top bar -->
  <div class="db-topbar">
    <div class="db-topbar-left">
      <span class="db-greeting" id="db-greeting">早安，同學！</span>
      <span class="db-date" id="db-date"></span>
    </div>
    <div class="db-topbar-right">
      <button class="db-back-btn" id="btn-back-grade" title="切換年級">⬅ 切換年級</button>
    </div>
  </div>

  <!-- Hero strip -->
  <div class="db-hero">
    <div class="db-hero-inner">
      <div class="db-hero-text">
        <h2 id="db-welcome-title">七年級數學學習中心</h2>
        <p>今天也一起努力吧！選擇想學習的模組開始。</p>
      </div>
      <div class="db-hero-badge">📐</div>
    </div>
  </div>

  <!-- Six-grid menu -->
  <div class="db-grid-wrap">
    <div class="db-grid">
      <button class="db-tile" id="tile-video" data-module="video">
        <span class="db-tile-icon" style="background:#e8f3fd;color:#4A90E2;">🎬</span>
        <span class="db-tile-label">教學影片</span>
      </button>
      <button class="db-tile" id="tile-quiz" data-module="quiz">
        <span class="db-tile-icon" style="background:#fef3c7;color:#d97706;">✏️</span>
        <span class="db-tile-label">隨堂測驗</span>
      </button>
      <button class="db-tile" id="tile-wrong" data-module="wrong">
        <span class="db-tile-icon" style="background:#fee2e2;color:#ef4444;">📋</span>
        <span class="db-tile-label">錯題紀錄</span>
      </button>
      <button class="db-tile" id="tile-analysis" data-module="analysis">
        <span class="db-tile-icon" style="background:#d1fae5;color:#059669;">📊</span>
        <span class="db-tile-label">學習分析</span>
      </button>
      <button class="db-tile" id="tile-formula" data-module="formula">
        <span class="db-tile-icon" style="background:#ede9fe;color:#7c3aed;">🔣</span>
        <span class="db-tile-label">公式速查</span>
      </button>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="db-progress-wrap">
    <div class="db-progress-card">
      <div class="db-stat">
        <span class="db-stat-val" id="stat-time">0</span>
        <span class="db-stat-label">學習時間(分)</span>
      </div>
      <div class="db-stat-divider"></div>
      <div class="db-stat">
        <span class="db-stat-val" id="stat-total">0</span>
        <span class="db-stat-label">完成題數</span>
      </div>
      <div class="db-stat-divider"></div>
      <div class="db-stat">
        <span class="db-stat-val" id="stat-acc">—</span>
        <span class="db-stat-label">正確率</span>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     SCREEN 4 — 教學影片
══════════════════════════════════════════ -->
<div class="screen" id="s-video">
  <div class="sub-topbar">
    <button class="sub-back" onclick="goScreen('s-dashboard')">← 返回</button>
    <h3>教學影片</h3>
    <div></div>
  </div>
  <div class="sub-body">
    <!-- Chapter list -->
    <div id="video-chapter-list">
      <p class="sub-hint">請選擇章節：</p>
      <div class="chapter-list" id="video-chapters"></div>
    </div>
    <!-- Video list (外連卡片模式) -->
    <div id="video-list-view" style="display:none;">
      <div class="sub-breadcrumb">
        <button class="crumb-back" id="btn-video-back-chapter">← 章節選單</button>
        <span id="video-chapter-title"></span>
      </div>
      <p class="video-open-hint">📌 點擊影片卡片，將在新分頁開啟 YouTube 播放（確保 100% 可播放）</p>
      <div class="video-list" id="video-items"></div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     SCREEN 5 — 隨堂測驗
══════════════════════════════════════════ -->
<div class="screen" id="s-quiz">
  <div class="sub-topbar">
    <button class="sub-back" onclick="goScreen('s-dashboard')">← 返回</button>
    <h3>隨堂測驗</h3>
    <div></div>
  </div>
  <div class="sub-body">
    <!-- Step A: chapter -->
    <div id="quiz-step-chapter">
      <p class="sub-hint">第一步：選擇章節</p>
      <div class="chapter-list" id="quiz-chapters"></div>
    </div>
    <!-- Step B: difficulty -->
    <div id="quiz-step-diff" style="display:none;">
      <div class="sub-breadcrumb">
        <button class="crumb-back" id="btn-quiz-back-ch">← 重選章節</button>
        <span id="quiz-ch-title"></span>
      </div>
      <p class="sub-hint">第二步：選擇難度</p>
      <div class="diff-grid">
        <button class="diff-btn" data-diff="初級">🟢 初級<span>基礎計算</span></button>
        <button class="diff-btn" data-diff="中級">🟡 中級<span>應用題型</span></button>
        <button class="diff-btn" data-diff="高級">🔴 高級<span>挑戰題</span></button>
        <button class="diff-btn" data-diff="綜合">🔵 綜合<span>混合難度</span></button>
      </div>
    </div>
    <!-- Step C: answering -->
    <div id="quiz-step-answering" style="display:none;">
      <div class="quiz-header-bar">
        <span id="quiz-progress-label">題目 1 / 10</span>
        <span id="quiz-ch-diff-label"></span>
      </div>
      <div id="quiz-question-card" class="question-card"></div>
      <div class="quiz-nav">
        <button class="btn-sec" id="btn-quiz-prev" disabled>← 上一題</button>
        <button class="btn-sec" id="btn-quiz-next">下一題 →</button>
        <button class="btn-submit" id="btn-quiz-submit" style="display:none;">✅ 送出答案</button>
      </div>
    </div>
    <!-- Step D: result -->
    <div id="quiz-step-result" style="display:none;">
      <div class="result-score-card">
        <div class="result-score-num" id="result-score">0 / 10</div>
        <div class="result-score-rate" id="result-rate">0%</div>
        <div class="result-score-msg" id="result-msg"></div>
      </div>
      <div id="result-detail"></div>
      <div style="text-align:center;margin-top:24px;">
        <button class="btn-primary" id="btn-quiz-again" style="max-width:240px;">再挑戰一次</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     SCREEN 6 — 錯題紀錄
══════════════════════════════════════════ -->
<div class="screen" id="s-wrong">
  <div class="sub-topbar">
    <button class="sub-back" onclick="goScreen('s-dashboard')">← 返回</button>
    <h3>錯題紀錄</h3>
    <div></div>
  </div>
  <div class="sub-body" id="wrong-body"></div>
</div>

<!-- ══════════════════════════════════════════
     SCREEN 7 — 學習分析
══════════════════════════════════════════ -->
<div class="screen" id="s-analysis">
  <div class="sub-topbar">
    <button class="sub-back" onclick="goScreen('s-dashboard')">← 返回</button>
    <h3>學習分析</h3>
    <div></div>
  </div>
  <div class="sub-body" id="analysis-body"></div>
</div>

<!-- ══════════════════════════════════════════
     SCREEN 8 — 公式速查
══════════════════════════════════════════ -->
<div class="screen" id="s-formula">
  <div class="sub-topbar">
    <button class="sub-back" onclick="goScreen('s-dashboard')">← 返回</button>
    <h3>公式速查</h3>
    <div></div>
  </div>
  <div class="sub-body" id="formula-body"></div>
</div>

<style>
/* ═══════════════════════════════════════
   Dashboard styles
═══════════════════════════════════════ */
.db-topbar {
  display:flex; justify-content:space-between; align-items:center;
  padding:16px 20px 12px;
  background:var(--white);
  border-bottom:1px solid var(--gray-200);
}
.db-greeting { font-size:1rem; font-weight:700; color:var(--gray-800); display:block; }
.db-date     { font-size:.78rem; color:var(--gray-600); display:block; margin-top:2px; }
.db-back-btn {
  font-size:.78rem; font-family:inherit; font-weight:600;
  color:var(--primary); background:var(--primary-light);
  border:none; border-radius:8px; padding:7px 14px; cursor:pointer;
  transition:background var(--transition);
}
.db-back-btn:hover { background:#d0e9fb; }

.db-hero {
  background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 100%);
  padding:28px 20px 24px;
}
.db-hero-inner { max-width:720px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.db-hero-text h2 { color:var(--white); font-size:1.3rem; font-weight:800; margin-bottom:6px; }
.db-hero-text p  { color:rgba(255,255,255,.85); font-size:.875rem; }
.db-hero-badge   { font-size:3rem; filter:drop-shadow(0 2px 4px rgba(0,0,0,.2)); }

.db-grid-wrap { max-width:720px; margin:0 auto; padding:24px 16px 0; }
.db-grid {
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:14px;
}
/* 五宮格：第 4、5 個按鈕置中於第 2 列 */
.db-grid .db-tile:nth-child(4) { grid-column:1; }
.db-grid .db-tile:nth-child(5) { grid-column:2; }
@media (max-width:480px) {
  .db-grid { grid-template-columns:repeat(2,1fr); }
  .db-grid .db-tile:nth-child(4),
  .db-grid .db-tile:nth-child(5) { grid-column:auto; }
  .db-grid .db-tile:nth-child(5) { grid-column:1/-1; max-width:50%; justify-self:center; }
}
.db-tile {
  display:flex; flex-direction:column; align-items:center; gap:10px;
  padding:20px 12px 18px;
  background:var(--white); border:1.5px solid var(--gray-200);
  border-radius:14px; cursor:pointer; font-family:inherit;
  transition:transform var(--transition),box-shadow var(--transition),border-color var(--transition);
}
.db-tile:hover {
  transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(74,144,226,.18);
  border-color:var(--primary);
}
.db-tile-icon {
  width:52px; height:52px; border-radius:14px;
  display:flex; align-items:center; justify-content:center; font-size:1.5rem;
}
.db-tile-label { font-size:.875rem; font-weight:700; color:var(--gray-800); }

.db-progress-wrap { max-width:720px; margin:20px auto 0; padding:0 16px 32px; }
.db-progress-card {
  background:var(--white); border-radius:14px; border:1.5px solid var(--gray-200);
  display:flex; align-items:center; justify-content:space-around; padding:18px 12px;
  box-shadow:var(--shadow-sm);
}
.db-stat { text-align:center; flex:1; }
.db-stat-val { display:block; font-size:1.5rem; font-weight:800; color:var(--primary); }
.db-stat-label { display:block; font-size:.75rem; color:var(--gray-600); margin-top:4px; }
.db-stat-divider { width:1px; height:40px; background:var(--gray-200); }

/* ═══════════════════════════════════════
   Sub-screen shared styles
═══════════════════════════════════════ */
.sub-topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px;
  background:var(--white);
  border-bottom:1px solid var(--gray-200);
  position:sticky; top:0; z-index:10;
}
.sub-topbar h3 { font-size:1rem; font-weight:700; color:var(--gray-800); }
.sub-back {
  font-size:.85rem; font-family:inherit; font-weight:600;
  color:var(--primary); background:transparent; border:none; cursor:pointer; padding:6px 0;
}
.sub-body { max-width:720px; margin:0 auto; padding:20px 16px 40px; }
.sub-hint { font-size:.875rem; color:var(--gray-600); margin-bottom:14px; font-weight:600; }

.sub-breadcrumb {
  display:flex; align-items:center; gap:10px;
  margin-bottom:16px; padding-bottom:12px;
  border-bottom:1px solid var(--gray-200);
}
.sub-breadcrumb span { font-size:.9rem; font-weight:700; color:var(--gray-800); }
.crumb-back {
  font-size:.82rem; font-family:inherit; font-weight:600;
  color:var(--primary); background:var(--primary-light);
  border:none; border-radius:8px; padding:6px 12px; cursor:pointer;
  white-space:nowrap;
}

/* ─── Chapter list ─── */
.chapter-list { display:flex; flex-direction:column; gap:10px; }
.chapter-btn {
  display:flex; align-items:center; gap:14px; padding:16px 18px;
  background:var(--white); border:1.5px solid var(--gray-200); border-radius:12px;
  cursor:pointer; font-family:inherit; font-size:.95rem; font-weight:600; color:var(--gray-800);
  transition:border-color var(--transition),background var(--transition),transform var(--transition);
  text-align:left;
}
.chapter-btn:hover { border-color:var(--primary); background:var(--primary-light); transform:translateX(3px); }
.ch-num {
  width:32px; height:32px; border-radius:8px;
  background:var(--primary-light); color:var(--primary);
  display:flex; align-items:center; justify-content:center;
  font-size:.8rem; font-weight:800; flex-shrink:0;
}
.ch-info { flex:1; }
.ch-name { display:block; }
.ch-sub  { display:block; font-size:.78rem; color:var(--gray-400); font-weight:400; margin-top:2px; }
.ch-arrow { color:var(--gray-400); font-size:1rem; }

/* ─── Video open hint ─── */
.video-open-hint {
  font-size:.8rem; color:var(--gray-600); background:var(--gray-100);
  border-radius:8px; padding:8px 12px; margin-bottom:14px;
  border-left:3px solid var(--primary);
}

/* ─── Video card (外連模式) ─── */
.video-list { display:flex; flex-direction:column; gap:12px; }
.video-card {
  background:var(--white); border:1.5px solid var(--gray-200); border-radius:14px;
  overflow:hidden; box-shadow:var(--shadow-sm);
  transition:border-color var(--transition),box-shadow var(--transition);
}
.video-card:hover { border-color:var(--primary); box-shadow:0 4px 16px rgba(74,144,226,.15); }

.video-card-thumb {
  position:relative; width:100%; padding-top:42%;
  background:linear-gradient(135deg,#1a2f4e,#2563eb);
  overflow:hidden;
}
.video-card-thumb img {
  position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover;
}
.video-thumb-fallback {
  position:absolute; top:0; left:0; width:100%; height:100%;
  align-items:center; justify-content:center;
  font-size:2.5rem; color:rgba(255,255,255,.7);
}
.video-card-play-btn {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:44px; height:44px; border-radius:50%;
  background:rgba(255,255,255,.92); color:var(--primary);
  display:flex; align-items:center; justify-content:center;
  font-size:1.1rem; pointer-events:none;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}

.video-card-body {
  display:flex; align-items:center; gap:12px; padding:14px 16px;
}
.video-card-num {
  font-size:1.1rem; font-weight:900; color:var(--primary);
  opacity:.35; flex-shrink:0; min-width:28px;
}
.video-card-info { flex:1; min-width:0; }
.video-card-title { display:block; font-size:.92rem; font-weight:700; color:var(--gray-800); margin-bottom:3px; }
.video-card-meta  { display:block; font-size:.75rem; color:var(--gray-400); }
.video-card-actions { display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
.video-btn-yt {
  display:block; padding:7px 12px; border-radius:8px; font-size:.78rem; font-weight:700;
  text-decoration:none; text-align:center; white-space:nowrap;
  background:#ff0000; color:#fff;
  transition:opacity var(--transition);
}
.video-btn-yt:hover { opacity:.85; }
.video-btn-junyi {
  display:block; padding:7px 12px; border-radius:8px; font-size:.78rem; font-weight:700;
  text-decoration:none; text-align:center; white-space:nowrap;
  background:var(--primary-light); color:var(--primary);
  transition:background var(--transition);
}
.video-btn-junyi:hover { background:#d0e9fb; }

/* ─── Quiz styles ─── */
.diff-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:4px; }
.diff-btn {
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:18px 12px; border:2px solid var(--gray-200); border-radius:12px;
  background:var(--white); cursor:pointer; font-family:inherit;
  font-size:1rem; font-weight:700; color:var(--gray-800);
  transition:border-color var(--transition),background var(--transition),transform var(--transition);
}
.diff-btn span { font-size:.75rem; font-weight:400; color:var(--gray-600); }
.diff-btn:hover { border-color:var(--primary); background:var(--primary-light); transform:translateY(-2px); }

.quiz-header-bar {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--gray-200);
}
.quiz-header-bar span { font-size:.875rem; font-weight:600; color:var(--gray-600); }

.question-card {
  background:var(--white); border:1.5px solid var(--gray-200);
  border-radius:14px; padding:20px 20px 8px; margin-bottom:16px;
  box-shadow:var(--shadow-sm);
}
.q-num   { font-size:.8rem; font-weight:700; color:var(--primary); margin-bottom:10px; display:block; }
.q-text  { font-size:1rem; color:var(--gray-800); line-height:1.7; margin-bottom:16px; }
.q-options { display:flex; flex-direction:column; gap:8px; }
.q-opt {
  display:flex; align-items:center; gap:10px; padding:12px 14px;
  border:1.5px solid var(--gray-200); border-radius:10px;
  cursor:pointer; font-family:inherit; font-size:.93rem; color:var(--gray-800);
  background:var(--white); text-align:left; font-weight:500;
  transition:border-color var(--transition),background var(--transition);
}
.q-opt:hover:not(:disabled)           { border-color:var(--primary); background:var(--primary-light); }
.q-opt.selected                        { border-color:var(--primary); background:var(--primary-light); font-weight:700; }
.q-opt.correct                         { border-color:var(--green); background:#d1fae5; }
.q-opt.wrong                           { border-color:var(--red); background:#fee2e2; }
.opt-key { font-weight:800; color:var(--primary); min-width:20px; }

.quiz-nav { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.btn-sec {
  padding:11px 20px; border:1.5px solid var(--gray-200); border-radius:10px;
  background:var(--white); cursor:pointer; font-family:inherit;
  font-size:.9rem; font-weight:600; color:var(--gray-800);
  transition:background var(--transition),border-color var(--transition);
}
.btn-sec:hover:not(:disabled) { background:var(--gray-100); border-color:var(--gray-400); }
.btn-sec:disabled { opacity:.45; cursor:not-allowed; }
.btn-submit {
  padding:11px 24px; border:none; border-radius:10px;
  background:var(--green); color:var(--white); cursor:pointer;
  font-family:inherit; font-size:.9rem; font-weight:700;
  transition:opacity var(--transition);
}
.btn-submit:hover { opacity:.87; }

/* ─── Result ─── */
.result-score-card {
  background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 100%);
  border-radius:14px; padding:28px 20px; text-align:center; margin-bottom:20px;
  color:var(--white);
}
.result-score-num  { font-size:2.5rem; font-weight:900; margin-bottom:4px; }
.result-score-rate { font-size:1.2rem; font-weight:700; opacity:.88; margin-bottom:8px; }
.result-score-msg  { font-size:.9rem; opacity:.8; }

.result-item {
  background:var(--white); border-radius:12px; border:1.5px solid var(--gray-200);
  margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow-sm);
}
.result-item-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; cursor:pointer;
}
.result-item-header:hover { background:var(--gray-50); }
.result-status { font-size:.8rem; font-weight:700; padding:4px 10px; border-radius:100px; }
.status-correct { background:#d1fae5; color:#059669; }
.status-wrong   { background:#fee2e2; color:#ef4444; }
.result-q-text  { font-size:.9rem; font-weight:600; color:var(--gray-800); flex:1; padding:0 12px; }
.result-detail-body {
  padding:14px 16px; border-top:1px solid var(--gray-200);
  background:var(--gray-50); display:none;
}
.result-detail-body.open { display:block; }
.detail-label { font-size:.78rem; font-weight:700; color:var(--gray-600); margin-top:10px; margin-bottom:4px; }
.detail-val   { font-size:.88rem; color:var(--gray-800); line-height:1.6; }
.detail-wrong { color:var(--red); } .detail-right { color:var(--green); }
.detail-steps { background:var(--white); border-radius:8px; padding:10px 12px; border:1px solid var(--gray-200); margin-top:4px; font-size:.85rem; line-height:1.7; color:var(--gray-800); }

/* ─── Wrong book ─── */
.wrong-chapter-block { margin-bottom:20px; }
.wrong-chapter-title { font-size:.9rem; font-weight:700; color:var(--primary); margin-bottom:10px; padding:6px 0; border-bottom:2px solid var(--primary-light); }
.wrong-item { background:var(--white); border:1.5px solid var(--gray-200); border-radius:12px; margin-bottom:10px; overflow:hidden; }
.wrong-item-header { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; cursor:pointer; }
.wrong-item-header:hover { background:var(--gray-50); }
.wrong-item-header .wq-text { font-size:.88rem; font-weight:600; color:var(--gray-800); flex:1; margin-right:10px; }
.wrong-item-body { padding:12px 14px; border-top:1px solid var(--gray-200); background:var(--gray-50); display:none; }
.wrong-item-body.open { display:block; }
.retry-btn {
  margin-top:12px; padding:8px 18px; border:none; border-radius:8px;
  background:var(--primary); color:var(--white); cursor:pointer;
  font-family:inherit; font-size:.85rem; font-weight:700;
  transition:opacity var(--transition);
}
.retry-btn:hover { opacity:.85; }
.empty-state { text-align:center; padding:48px 20px; color:var(--gray-400); }
.empty-state .es-icon { font-size:2.5rem; margin-bottom:12px; }
.empty-state p { font-size:.9rem; }

/* ─── Analysis ─── */
.analysis-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
.analysis-card {
  background:var(--white); border:1.5px solid var(--gray-200); border-radius:12px;
  padding:16px 14px; text-align:center;
}
.analysis-card .a-val   { display:block; font-size:1.6rem; font-weight:800; color:var(--primary); }
.analysis-card .a-label { display:block; font-size:.78rem; color:var(--gray-600); margin-top:4px; }
.ch-bar-wrap { background:var(--white); border:1.5px solid var(--gray-200); border-radius:12px; padding:16px; }
.ch-bar-title { font-size:.875rem; font-weight:700; color:var(--gray-800); margin-bottom:14px; }
.ch-bar-row { margin-bottom:12px; }
.ch-bar-row-label { display:flex; justify-content:space-between; font-size:.78rem; color:var(--gray-600); margin-bottom:5px; }
.ch-bar-bg { height:8px; background:var(--gray-200); border-radius:4px; overflow:hidden; }
.ch-bar-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,var(--primary),var(--accent)); transition:width .6s ease; }

/* ─── Formula ─── */
.formula-section { margin-bottom:20px; }
.formula-section-title { font-size:.9rem; font-weight:700; color:var(--primary); padding:8px 0; margin-bottom:10px; border-bottom:2px solid var(--primary-light); }
.formula-item { background:var(--white); border:1.5px solid var(--gray-200); border-radius:10px; padding:14px 16px; margin-bottom:8px; }
.formula-item .f-name { font-size:.82rem; font-weight:700; color:var(--gray-600); margin-bottom:6px; }
.formula-item .f-expr { font-size:1rem; color:var(--gray-800); }

/* ─── Placeholder ─── */
.placeholder-box { text-align:center; padding:60px 20px; color:var(--gray-400); }
.placeholder-box h3 { font-size:1.1rem; font-weight:700; color:var(--gray-600); margin:12px 0 8px; }
.placeholder-box p  { font-size:.88rem; }
</style>

<script src="app.js" defer></script>
</body>
</html>
